[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "morphoraman"
version = "0.1.0"
description = "Refactored morphogenetic Raman inference pipeline extracted from a final working notebook."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Proprietary"}
authors = [
  {name = "Refactored from user notebook with ChatGPT"}
]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "matplotlib>=3.7",
  "scikit-learn>=1.3",
]

[project.optional-dependencies]
dev = [
  "ipykernel>=6.0",
  "jupyter>=1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/morphoraman"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/scripts",
  "/README.md",
  "/pyproject.toml",
  "/notebooks",
]
